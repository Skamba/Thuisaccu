[package]
name = "thuisaccu-server"
description = "Webinterface en HTTP API voor thuisaccukeuzes"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
tracing.workspace = true
thuisaccu-storage = { path = "../storage" }
thuisaccu-core = { path = "../core" }
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
csv.workspace = true
calamine.workspace = true
quick-xml.workspace = true
zip.workspace = true
sha2.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing-subscriber.workspace = true
reqwest.workspace = true

# In de browser (crates/browser): adreszoeken via de fetch van de browser.
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = ["sync"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AbortSignal",
    "Headers",
    "ReferrerPolicy",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
    "WorkerGlobalScope",
] }

[dev-dependencies]
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
