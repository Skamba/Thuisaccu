[package]
name = "thuisaccu-storage"
description = "SQLite-onderzoekscatalogus voor thuisaccu's"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thuisaccu-core = { path = "../core" }
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# In de browser levert rusqlite zelf een WebAssembly-build van SQLite; daarbuiten wordt SQLite meegecompileerd.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
