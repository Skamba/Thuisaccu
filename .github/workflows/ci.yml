name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Een nieuwere push op dezelfde branch maakt een lopende controle overbodig. De publicatie op
# GitHub Pages staat los hiervan in pages.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust and quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked

  e2e:
    name: Browsertests en browserversie (ubuntu-latest)
    runs-on: ubuntu-latest
    # Normaal ongeveer 5 minuten; het installeren van de systeempakketten voor Chromium duurde soms ruim
    # 10 minuten. Daarboven hangt er iets en stopt de run, in plaats van zes uur te wachten.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust with the WebAssembly target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      # SQLite wordt voor de browserversie met clang naar WebAssembly gecompileerd.
      - name: Install clang and llvm-ar
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - name: Install wasm-bindgen-cli (versie uit Cargo.lock)
        run: sh tools/install-wasm-bindgen.sh
      - name: Build server
        run: cargo build --locked -p thuisaccu-server
      - name: Lint WebAssembly build
        run: cargo clippy --locked --target wasm32-unknown-unknown -p thuisaccu-browser -p thuisaccu-server -p thuisaccu-storage --lib -- -D warnings
      - name: Build browser version
        run: sh tools/build-site.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check frontend syntax
        run: for f in web/*.js; do node --check "$f"; done
      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests (local server)
        working-directory: tests/e2e
        run: npm test
      - name: Browser tests (browser version)
        working-directory: tests/e2e
        env:
          E2E_MODE: browser
        run: npm test
