[workspace]
members = ["crates/core", "crates/storage", "crates/server"]
default-members = ["crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
calamine = { version = "0.37", features = ["dates"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

